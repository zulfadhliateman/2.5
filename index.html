k ditukar menjadi…", ["Asetil koenzim A", "Asid laktik", "Fosfokreatin", "Glukosa"], 0, "Dengan kehadiran oksigen, asid piruvik ditukar menjadi asetil KoA."], ["Proses yang meneruskan pembinaan ATP selepas asetil KoA terbentuk ialah…", ["Glikolisis anaerobik", "Kitaran Krebs", "Penguraian ATP-PC", "Pembentukan hemoglobin"], 1, "Asetil KoA merangsang pembinaan ATP berlanjutan menerusi Kitaran Krebs."], ["Sistem aerobik menggunakan sumber tenaga…", ["Fosfokreatin sahaja", "Asid laktik sahaja", "Karbohidrat dan lemak", "Oksigen sahaja"], 2, "Karbohidrat dan lemak ialah sumber tenaga sistem aerobik; oksigen diperlukan dalam prosesnya."], ["Jumlah ATP sistem aerobik daripada satu molekul sumber tenaga ialah…", ["1 mol", "2–3 mol", "10 mol", "Lebih 100 mol"], 3, "Jadual buku teks menyatakan sistem aerobik menghasilkan lebih 100 mol ATP."], ["Sistem dengan kadar maksimum pengeluaran ATP paling pantas ialah…", ["Anaerobik alaktik", "Anaerobik laktik", "Aerobik", "Ketiga-tiganya sama"], 0, "Anaerobik alaktik mempunyai kadar pelepasan tenaga paling pantas."], ["Sistem yang membekalkan ATP dengan pesat tetapi tidak sepantas alaktik ialah…", ["Aerobik", "Anaerobik laktik", "Sistem pencernaan", "Sistem respiratori"], 1, "Anaerobik laktik pantas tetapi tidak sepantas anaerobik alaktik."], ["Sistem paling perlahan menyediakan ATP ialah…", ["Anaerobik alaktik", "Anaerobik laktik", "Aerobik", "ATP-PC"], 2, "Sistem aerobik paling perlahan kerana tindak balas kimianya kompleks."], ["Faktor yang mengehadkan sistem anaerobik alaktik ialah…", ["Pengurangan glikogen", "Hipertermia", "Pengumpulan asid laktik", "Pengurangan simpanan fosfokreatin"], 3, "Pengurangan simpanan fosfokreatin mengehadkan sistem anaerobik alaktik."], ["Faktor yang mengehadkan sistem anaerobik laktik ialah…", ["Pengumpulan asid laktik dan ion hidrogen", "Pengurangan PC sahaja", "Kekurangan kalsium", "Pengurangan alveolus"], 0, "Asid laktik dan ion hidrogen yang terkumpul mengehadkan sistem anaerobik laktik."], ["Antara faktor yang mengehadkan sistem aerobik ialah…", ["Pengurangan PC sahaja", "Pengurangan glukosa dan glikogen serta hipertermia", "Kekurangan kreatina sahaja", "Ketiadaan sendi sinovial"], 1, "Jadual turut menyenaraikan pengumpulan asid laktik dan ion hidrogen, pengurangan simpanan glukosa/glikogen serta hipertermia."], ["Sistem tenaga dominan bagi acara maraton ialah…", ["Anaerobik alaktik", "Anaerobik laktik", "Aerobik", "ATP-PC sahaja"], 2, "Maraton menggunakan sistem aerobik secara dominan."], ["Memanah dan menembak disenaraikan di bawah sistem dominan…", ["Anaerobik laktik", "Anaerobik alaktik", "Ketiga-tiga sama", "Aerobik"], 3, "Jadual sistem tenaga dominan meletakkan memanah dan menembak di bawah aerobik."], ["Acara lontaran dan lompatan olahraga menggunakan sistem dominan…", ["Anaerobik alaktik", "Anaerobik laktik", "Aerobik", "Oksidatif sahaja"], 0, "Acara padang lontaran dan lompatan menggunakan sistem anaerobik alaktik."], ["Sistem tenaga dominan ditentukan oleh…", ["Warna pakaian dan lokasi", "Kemahiran motor, tempoh dan intensiti aktiviti", "Umur sahaja", "Jantina sahaja"], 1, "Ciri kemahiran motor, tempoh masa dan intensiti aktiviti menentukan sistem dominan."], ["Bagi lumba jalan kaki 10 km, sistem tenaga untuk 10 saat pertama ialah…", ["Aerobik", "Anaerobik laktik", "Anaerobik alaktik", "Kitaran Krebs sahaja"], 2, "Sepuluh saat pertama menggunakan sistem anaerobik alaktik."], ["Tempoh 10–60 saat menunjukkan peralihan…", ["Aerobik kepada alaktik", "Anaerobik laktik kepada aerobik", "Aerobik sepenuhnya", "Anaerobik alaktik kepada anaerobik laktik"], 3, "Jadual menyatakan peralihan anaerobik alaktik kepada anaerobik laktik bagi 10–60 saat."], ["Tempoh 60 saat hingga 2 minit menggunakan sistem…", ["Anaerobik laktik", "Anaerobik alaktik", "Aerobik", "Oksidatif sepenuhnya"], 0, "Tempoh 60 saat hingga 2 minit ialah anaerobik laktik."], ["Tempoh 2 hingga 3 minit menunjukkan peralihan…", ["Alaktik kepada laktik", "Anaerobik laktik kepada aerobik", "Aerobik kepada alaktik", "Laktik kepada alaktik"], 1, "Tempoh 2–3 minit menunjukkan peralihan anaerobik laktik kepada aerobik."], ["Sistem aerobik menjadi dominan apabila aktiviti berterusan melebihi…", ["10 saat", "60 saat", "3 minit", "30 saat"], 2, "Buku teks menyatakan sistem aerobik dominan bagi aktiviti melebihi tiga minit."], ["Padanan aktiviti dan sistem tenaga yang betul ialah…", ["Lontar peluru – aerobik", "Lari 100 m – aerobik", "Maraton – anaerobik alaktik", "Maraton – aerobik"], 3, "Maraton ialah acara jarak jauh yang menggunakan sistem aerobik secara dominan."], ["Pilih gabungan yang betul.\nI. Anaerobik alaktik tidak memerlukan oksigen.\nII. Anaerobik laktik menggunakan glikogen dan glukosa.\nIII. Aerobik memerlukan oksigen.\nIV. Aerobik menghasilkan ATP paling sedikit.", ["I dan II sahaja", "I, II dan III sahaja", "II, III dan IV sahaja", "I, II, III dan IV"], 1, "I, II dan III betul. IV salah kerana sistem aerobik menghasilkan ATP jauh lebih banyak."], ["Pilih gabungan yang betul tentang anaerobik alaktik.\nI. Dikenali sebagai ATP-PC.\nII. Sumbernya fosfokreatin.\nIII. Membekalkan tenaga kira-kira 10 saat.\nIV. Memerlukan oksigen.", ["I, II dan III sahaja", "I dan IV sahaja", "II, III dan IV sahaja", "Semua pernyataan"], 0, "I, II dan III betul. IV salah kerana sistem ini tidak menggunakan oksigen."], ["Pilih gabungan yang betul tentang anaerobik laktik.\nI. Dikenali sebagai glikolisis anaerobik.\nII. Menggunakan glikogen dan glukosa.\nIII. Menghasilkan asid laktik.\nIV. Memerlukan oksigen.", ["I dan IV sahaja", "II dan IV sahaja", "I, II dan III sahaja", "Semua pernyataan"], 2, "I, II dan III betul. IV salah kerana sistem anaerobik laktik tidak memerlukan oksigen."], ["Pilih gabungan yang betul tentang sistem aerobik.\nI. Dikenali sebagai sistem oksidatif.\nII. Memerlukan oksigen.\nIII. Asid piruvik ditukar menjadi asetil KoA.\nIV. Kitaran Krebs terlibat.", ["I dan II sahaja", "II dan III sahaja", "I, II dan IV sahaja", "I, II, III dan IV"], 3, "Keempat-e let index=0, score=0, answered=false;
const $=id=>document.getElementById(id);
function render(){
 answered=false;$('count').textContent=`Soalan ${index+1} daripada ${data.length}`;
 $('score').textContent=`Markah: ${score}`;$('bar').style.width=(index/data.length*100)+'%';
 $('question').textContent=data[index][0];$('options').innerHTML='';
 data[index][1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+v;b.onclick=()=>choose(i,b);$('options').appendChild(b)});
 $('feedback').className='feedback';$('feedback').style.display='none';$('feedback').textContent='';$('next').disabled=true;
 $('next').textContent=index===data.length-1?'Lihat keputusan':'Soalan seterusnya →';
}
function choose(i,btn){
 if(answered)return;answered=true;const q=data[index], correct=q[2], opts=[...$('options').children];
 opts.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');if(j===i&&i!==correct)b.classList.add('wrong')});
 if(i===correct)score++;
 $('score').textContent=`Markah: ${score}`;
 let f=$('feedback');f.className='feedback '+(i===correct?'good':'bad');f.style.display='block';
 f.innerHTML=(i===correct?'<b>Betul!</b> ':'<b>Kurang tepat.</b> Jawapan yang betul ialah <b>'+('ABCD'[correct])+'. '+q[1][correct]+'</b>. ')+q[3]+(i!==correct?'<br><span>Distraktor yang dipilih tidak menepati konsep atau fakta yang diuji.</span>':'');
 $('next').disabled=false;
}
function next(){if(!answered)return;if(index<data.length-1){index++;render()}else finish()}
function finish(){$('quiz').style.display='none';$('result').style.display='block';$('final').textContent=`Markah anda: ${score} / ${data.length} (${Math.round(score/data.length*100)}%)`;$('remark').textContent=score/data.length>=.8?'Tahniah! Penguasaan anda sangat baik.':score/data.length>=.5?'Baik. Ulang kaji semula bahagian yang masih kurang dikuasai.':'Teruskan usaha dan cuba semula selepas membuat ulang kaji.'}
function restart(){index=0;score=0;$('result').style.display='none';$('quiz').style.display='block';render()}
$('next').addEventListener('click',next);render();
</script></body></html>
